# Local-development site config.
# Nginx's official image includes this file inside its http {} block,
# so there is no events {}, http {}, or server_name needed here.

server {
    # Listen on port 80 inside the nginx container; step 5 publishes it as 127.0.0.1:8080.
    listen 80;

    # Reject request bodies larger than 1 MB before they ever reach PHP (API §8.2).
    client_max_body_size 1m;

    # Regex location for every path Laravel owns, including their subpaths.
    # The (/|$) suffix prevents matching unrelated paths like /updates or /apix.
    # PHP-FPM speaks FastCGI, not HTTP. When Nginx receives a request for a
    # Laravel path, it converts it into a FastCGI request for PHP-FPM.
    location ~ ^/(api|sanctum|broadcasting|up)(/|$) {
        # Load Nginx's standard FastCGI variables (method, URI, query string, ...).
        include fastcgi_params;

        # Hand the request to the "app" Compose service on PHP-FPM's internal port 9000.
        fastcgi_pass app:9000;

        # Always execute Laravel's front controller; this path is inside the app container.
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;

        # Override SCRIPT_NAME so Laravel computes the correct base URL.
        fastcgi_param SCRIPT_NAME /index.php;

        # Preserve the original scheme so Laravel knows it is http (or https behind TLS).
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Fallback: everything that is not Laravel's is the Vite SPA.
    location / {
        # Proxy HTTP to the "frontend" Compose service at Vite's internal port.
        proxy_pass http://frontend:5173;

        # HTTP/1.1 is required to allow WebSocket connection upgrades.
        proxy_http_version 1.1;

        # Pass the browser's Upgrade header through to Vite for HMR.
        proxy_set_header Upgrade $http_upgrade;

        # Mark this connection as a WebSocket upgrade for the upstream.
        proxy_set_header Connection "upgrade";

        # Preserve the browser's Host header (localhost:8080) so Vite sees it.
        proxy_set_header Host $host;
    }

    # Placeholder for Laravel Reverb's WebSocket endpoint; enabled on Day 49.
    # location /app {
    #     proxy_pass http://reverb:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }
}